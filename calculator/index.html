<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <p class="screen"> 
    </p>
    <div class="cbody">
        <div class="digits">
            <button class="number">9</button>
            <button class="number">8</button>
            <button class="number">7</button>
            <button class="number">6</button>
            <button class="number">5</button>
            <button class="number">4</button>
            <button class="number">3</button>
            <button class="number">2</button>
            <button class="number">1</button>
            <button class="number zero">0</button>
            <button class="number decimal">.</button>
        </div>
        <div class="operations">
            <button class="operation" id="clear">Clear</button>
            <button class="operation" id="bspc">Back</button>
            <button class="operation" id="divide">÷</button>
            <button class="operation" id="multiply">x</button>
            <button class="operation" id="subtract">-</button>
            <button class="operation" id="add">+</button>
            <button class="operation" id="equals">=</button>
        </div>
    </div>
</body>
</html>
