<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="./index.js" type="module"></script>
    <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
    <div id="mainContainer">
        <h1>Weather App</h1>
        <form id="mainSearchContainer" action="#" class="searchBarContainer">
            <input class="searchBar" type="search" id="mainSearch" name="search" placeholder="Put in a city (eg. London)"/>
            <button id="mainSearchBtn" class="searchBtn">
                <svg class="containSVG">
                    <use href="./assets/icons.svg#searchSVG"></use>
                </svg>
            </button>
        </form>
    </div>
</body>
</html>
