<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaDash</title>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
    <main id="mainContainer" class="landing-mode">
        <div class="logoContainer">
            <span class="logoFirst">Ava</span>
            <span class="logoSecond">Dash</span>
        </div>
        <form id="mainSearchContainer" action="#" class="searchBarContainer">
            <input class="searchBar" type="search" id="mainSearch" name="search" placeholder="Put in a city (eg. London)"/>
            <button id="mainSearchBtn" class="searchBtn">
                <svg class="containSVG">
                    <use href="./assets/icons.svg#searchSVG"></use>
                </svg>
            </button>
        </form>
    </main>
</body>
</html>
